name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/docker_project]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest-django
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Linting
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test Docker Build
      run: docker compose build

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Деплой сработает только при слиянии/пуше в main
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # точное имя папки проекта на сервере вместо ИМЯ_ПАПКИ_ПРОЕКТА
          cd /home/${{ secrets.SERVER_USER }}/ИМЯ_ПАПКИ_ПРОЕКТА
          
          # Забираем свежий код
          git pull origin main
          
          # Обновляем переменные окружения из секретов GitHub
          echo "${{ secrets.ENV_FILE }}" > .env
          
          # Пересобираем и перезапускаем контейнеры
          docker compose down
          docker compose up -d --build
          
          # Применяем миграции и собираем статику внутри контейнера web
          docker compose exec -T web python manage.py migrate
          docker compose exec -T web python manage.py collectstatic --no-input
